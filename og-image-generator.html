function draw() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 1200, H = 630;

  // Fondo
  ctx.fillStyle = '#0f1117';
  ctx.fillRect(0, 0, W, H);

  // Grid sutil
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Gradiente radial dorado (esquina superior derecha)
  const rg1 = ctx.createRadialGradient(W, 0, 0, W, 0, 550);
  rg1.addColorStop(0, 'rgba(245,200,66,0.18)');
  rg1.addColorStop(1, 'transparent');
  ctx.fillStyle = rg1;
  ctx.fillRect(0, 0, W, H);

  // Gradiente radial azul (esquina inferior izquierda)
  const rg2 = ctx.createRadialGradient(0, H, 0, 0, H, 400);
  rg2.addColorStop(0, 'rgba(96,165,250,0.08)');
  rg2.addColorStop(1, 'transparent');
  ctx.fillStyle = rg2;
  ctx.fillRect(0, 0, W, H);

  // Círculos decorativos
  ctx.strokeStyle = 'rgba(245,200,66,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(1050, 310, 190, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(245,200,66,0.06)';
  ctx.beginPath(); ctx.arc(1050, 310, 270, 0, Math.PI*2); ctx.stroke();

  // Barra dorada superior
  const tg = ctx.createLinearGradient(0,0,700,0);
  tg.addColorStop(0, '#f5c842');
  tg.addColorStop(0.6, '#e8a820');
  tg.addColorStop(1, 'transparent');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, 5);

  // Pill badge
  ctx.fillStyle = 'rgba(245,200,66,0.12)';
  roundRect(ctx, 80, 82, 268, 36, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(245,200,66,0.4)';
  ctx.lineWidth = 1;
  roundRect(ctx, 80, 82, 268, 36, 18); ctx.stroke();
  ctx.fillStyle = '#f5c842';
  ctx.beginPath(); ctx.arc(103, 100, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f5c842';
  ctx.font = '600 14px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('Sistemas de Ventas con IA', 116, 105);

  // Título principal
  ctx.fillStyle = '#f1f5f9';
  ctx.font = '800 64px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('Tu negocio no necesita', 80, 200);
  ctx.fillText('más leads. Necesita', 80, 278);
  ctx.fillStyle = '#f5c842';
  ctx.fillText('un sistema.', 80, 356);

  // Subtítulo
  ctx.fillStyle = '#94a3b8';
  ctx.font = '400 20px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('Diseñamos el proceso completo para que tu negocio', 80, 412);
  ctx.fillText('venda solo, sin depender de tu tiempo.', 80, 440);

  // Separador footer
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 560); ctx.lineTo(W, 560); ctx.stroke();

  // URL
  ctx.fillStyle = '#64748b';
  ctx.font = '600 16px "Segoe UI",system-ui,sans-serif';
  ctx.fillText('elbufalo.site', 80, 597);

  // Bullets
  const bullets = ['PyMEs & emprendedores', 'Resultados en 30 días', 'Buenos Aires, Argentina'];
  let bx = 460;
  bullets.forEach(label => {
    ctx.fillStyle = '#f5c842';
    ctx.font = '700 15px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('✓', bx, 597);
    ctx.fillStyle = '#64748b';
    ctx.font = '500 15px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(label, bx + 18, 597);
    bx += ctx.measureText(label).width + 50;
  });

  // Logo
  const logo = new Image();
  logo.onload = () => {
    const lh = 68;
    const lw = (logo.width / logo.height) * lh;
    ctx.drawImage(logo, 80, 480, lw, lh);
  };
  logo.src = LOGO;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function download() {
  const canvas = document.getElementById('c');
  const link = document.createElement('a');
  link.download = 'og-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

draw();
</script>
